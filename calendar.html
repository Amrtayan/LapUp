<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LapUp Calendar — total session time and average efficiency for each day." />
  <title>LapUp — Calendar</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4a90d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LapUp" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="goal-tracker.css" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>

  <div class="gt-page">

    <!-- ── SIDEBAR ── -->
    <aside class="gt-sidebar" id="gt-sidebar">
      <div class="gt-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <div>
          <h1 class="gt-brand-title">LapUp</h1>
          <p class="gt-brand-sub">FOCUS MODE ACTIVE</p>
        </div>
      </div>

      <nav class="gt-nav">
        <a href="goal-tracker.html" class="gt-nav-link" id="nav-goal-tracker">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>GOAL TRACKER</span>
        </a>
        <a href="index.html" class="gt-nav-link" id="nav-sessions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>SESSIONS</span>
        </a>
        <a href="calendar.html" class="gt-nav-link active" id="nav-calendar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/>
            <line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/>
          </svg>
          <span>CALENDAR</span>
        </a>
      </nav>
    </aside>

    <!-- ── MAIN CONTENT ── -->
    <main class="gt-main cal-main">

      <!-- Mobile-only nav (the sidebar is hidden on small screens) -->
      <nav class="cal-mobile-nav" aria-label="Pages">
        <a href="goal-tracker.html">Goals</a>
        <a href="index.html">Sessions</a>
        <a href="calendar.html" class="active">Calendar</a>
      </nav>

      <div class="gt-header-row">
        <div class="gt-date-info">
          <div class="gt-date-title-row">
            <h2 class="gt-month" id="cal-month"></h2>
            <div class="gt-date-nav">
              <button class="gt-nav-arrow" id="btn-prev-month" title="Previous month" aria-label="Previous month">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button class="gt-nav-arrow" id="btn-next-month" title="Next month" aria-label="Next month">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="cal-header-actions">
          <div class="cal-baseline">
            <label for="baseline-input" class="cal-baseline-label">Baseline</label>
            <input type="text" id="baseline-input" class="cal-baseline-input" placeholder="00:00:00" inputmode="numeric" autocomplete="off" aria-label="Baseline session time (HH:MM:SS)" title="Days with less total session time than this show in red" />
          </div>
          <button class="cal-today-btn" id="btn-today" type="button">TODAY</button>
        </div>
      </div>

      <div class="cal-card">
        <div class="cal-weekdays" id="cal-weekdays"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

    </main>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
